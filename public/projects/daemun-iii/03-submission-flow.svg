<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">DAEMUN III resolution submission workflow</title>
  <desc id="desc">A team lead uploads a draft. The API checks team permissions, records a version, and notifies teammates. Organizers review the draft and publish approved resolutions by committee.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8797b6"/></marker></defs>
  <rect width="1440" height="900" rx="20" fill="#0f1b33"/>
  <g font-family="Arial, sans-serif">
    <text x="90" y="100" fill="#d4b77a" font-size="20" letter-spacing="4">DAEMUN III / SUBMISSION WORKFLOW</text>
    <text x="90" y="165" fill="#fff" font-size="43" font-weight="bold">A draft, with a record of what happened.</text>
    <text x="90" y="211" fill="#b7c4da" font-size="22">Co-developed by Junwon Kim and Minchan Kim</text>
    <g stroke="#8797b6" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M 450 360 H 525"/><path d="M 915 360 H 990"/><path d="M 1160 450 V 640 H 915"/><path d="M 525 640 H 450"/>
    </g>
    <g fill="#1b2b48" stroke="#51627f" stroke-width="2">
      <rect x="90" y="280" width="360" height="170" rx="16"/>
      <rect x="540" y="280" width="360" height="170" rx="16"/>
      <rect x="990" y="280" width="360" height="170" rx="16"/>
      <rect x="540" y="555" width="360" height="170" rx="16"/>
      <rect x="90" y="555" width="360" height="170" rx="16" stroke="#d4b77a"/>
    </g>
    <g fill="#fff" font-size="27" font-weight="bold">
      <text x="120" y="328">01 / Team lead</text><text x="570" y="328">02 / API checks</text><text x="1020" y="328">03 / Upload record</text>
      <text x="570" y="603">04 / Organizer review</text><text x="120" y="603">05 / Publish</text>
    </g>
    <g fill="#c9d4e7" font-size="22">
      <text x="120" y="375">Upload or replace a draft</text><text x="120" y="408">File goes to storage</text>
      <text x="570" y="375">Account + team role</text><text x="570" y="408">Finalize the submission</text>
      <text x="1020" y="375">Append a version</text><text x="1020" y="408">Notify other team members</text>
      <text x="570" y="650">Review the submitted draft</text><text x="570" y="683">Mark it approved</text>
      <text x="120" y="650">Release by committee</text><text x="120" y="683">or across all committees</text>
    </g>
    <text x="90" y="805" fill="#b7c4da" font-size="20">Version history: delegate uploads. Notification failure does not cancel a submission.</text>
    <text x="90" y="845" fill="#8797b6" font-size="18">Implementation illustration / not a production dashboard or measured performance result</text>
  </g>
</svg>
